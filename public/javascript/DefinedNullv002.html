<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Defined Null</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            cursor: default;
        }
        canvas {
            display: block;
        }
        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Deixa os cliques passarem para o canvas */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }
        .top-ui, .bottom-ui, #boss-ui {
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
        }
        .top-ui {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            text-shadow: 0 0 5px black;
        }
        #boss-ui {
            position: absolute;
            top: 20px;
            left: 0;
            display: none; /* Escondido por padrão */
            flex-direction: column;
            align-items: center;
        }
        #boss-health-bar-container {
            width: 50%;
            height: 30px;
            background-color: rgba(128, 0, 128, 0.3);
            border-radius: 15px;
            border: 3px solid #DA70D6;
            overflow: hidden;
        }
        #boss-health-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #8A2BE2, #DA70D6);
            transition: width 0.5s ease-out;
        }
        #boss-name {
            font-size: 2em;
            font-weight: bold;
            color: #DA70D6;
            text-shadow: 0 0 10px #DA70D6;
            margin-bottom: 10px;
        }

        .bottom-ui {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 30px;
        }
        #health-bar-container {
            width: 250px;
            height: 25px;
            background-color: rgba(255, 0, 0, 0.2);
            border-radius: 12px;
            border: 2px solid #ff4444;
            overflow: hidden;
        }
        #health-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff4444, #ff8888);
            transition: width 0.3s ease-out;
        }
        #score, #wave-counter, #timer {
            font-size: 2em;
            font-weight: bold;
        }
        #timer {
            color: #00FFFF;
        }
        #controller-status {
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 15px;
            font-size: 1.2em;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            color: white;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            pointer-events: all;
            cursor: default;
            z-index: 10;
        }
        .overlay-screen h1 {
            font-size: 5em;
            margin: 0;
            text-shadow: 0 0 20px;
        }
        #start-screen h1 {
            color: #00FFFF;
            text-shadow: 0 0 20px #00FFFF;
            margin-bottom: 40px;
        }
        .start-form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            font-size: 1.5em;
        }
        #wave-input {
            font-size: 1.2em;
            padding: 10px;
            width: 100px;
            text-align: center;
            background-color: rgba(255, 255, 255, 0.1);
            border: 2px solid #00FFFF;
            color: white;
            border-radius: 8px;
        }
        #wave-input::-webkit-outer-spin-button,
        #wave-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        #wave-input[type=number] {
            -moz-appearance: textfield;
        }
        #start-button {
            padding: 15px 30px;
            font-size: 1.5em;
            cursor: pointer;
            background: #00c1ff;
            border: none;
            color: white;
            border-radius: 10px;
            text-transform: uppercase;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 0 15px rgba(0, 193, 255, 0.5);
        }
        #start-button:hover {
            background-color: #44aaff;
            transform: scale(1.05);
        }
        #game-over-screen h1 {
            color: #ff4444;
            text-shadow: 0 0 20px red;
        }
        #pause-screen h1 {
            color: #44aaff;
            text-shadow: 0 0 20px #44aaff;
        }
        #loading-wave-screen h1 {
            font-size: 3em;
            color: #FFA500;
            text-shadow: 0 0 20px #FFA500;
        }
        #game-over-screen h2 {
            font-size: 2.5em;
            margin: 20px 0;
            color: #00FFFF;
        }
        #restart-button {
            padding: 15px 30px;
            font-size: 1.5em;
            cursor: pointer;
            background: #ff4444;
            border: none;
            color: white;
            border-radius: 10px;
            text-transform: uppercase;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 0 15px rgba(255, 68, 68, 0.5);
        }
        #restart-button:hover {
            background-color: #ff6666;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div id="start-screen" class="overlay-screen" style="display: flex;">
        <h1>Defined Null</h1>
        <div class="start-form">
            <label for="wave-input">Start on Wave:</label>
            <input type="number" id="wave-input" value="1" min="1">
            <button id="start-button">Start Game</button>
            <div></div>
            <div>Controls:</div>
            <div>Move Mouse to Aim & Shoot, WASD/Arrows - Move, ESC - Pause</div>
            <div>Dualsense controller: Left Sticks Move and Right Shoot</div>
        </div>
    </div>
    
    <div id="ui-container" style="display: none;">
        <div class="top-ui">
            <div id="health-bar-container">
                <div id="health-bar"></div>
            </div>
            <div>
                <div id="score">Score: 0</div>
                <div id="wave-counter">Wave: 1</div>
                <div id="timer">Tempo: 00:00</div>
            </div>
        </div>
        <div id="boss-ui">
            <div id="boss-name"></div>
            <div id="boss-health-bar-container">
                <div id="boss-health-bar"></div>
            </div>
        </div>
        <div class="bottom-ui">
            <div id="controller-status">Dualsense / Keyboard (WASD + Move Mouse + ESC)</div>
        </div>
    </div>
    
    <div id="game-over-screen" class="overlay-screen">
        <h1 id="game-over-title">Game Over</h1>
        <h2 id="final-score"></h2>
        <button id="restart-button">Restart</button>
    </div>

    <div id="pause-screen" class="overlay-screen">
        <h1>Defined Null</h1>
        <h1>Game Paused</h1>
    </div>

    <div id="loading-wave-screen" class="overlay-screen">
        <h1>Aguardando carregamento da próxima wave...</h1>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        class SpatialGrid {
            constructor(bounds, dimensions) {
                this.bounds = bounds;
                this.dimensions = dimensions;
                this.cells = new Map();
            }

            getCellKey(x, z) {
                const col = Math.floor((x - this.bounds.x) / this.dimensions.width);
                const row = Math.floor((z - this.bounds.z) / this.dimensions.height);
                return `${col},${row}`;
            }

            insert(obj) {
                const key = this.getCellKey(obj.position.x, obj.position.z);
                if (!this.cells.has(key)) {
                    this.cells.set(key, []);
                }
                this.cells.get(key).push(obj);
            }

            getNearby(obj) {
                const nearby = [];
                const col = Math.floor((obj.position.x - this.bounds.x) / this.dimensions.width);
                const row = Math.floor((obj.position.z - this.bounds.z) / this.dimensions.height);

                for (let i = -1; i <= 1; i++) {
                    for (let j = -1; j <= 1; j++) {
                        const key = `${col + i},${row + j}`;
                        if (this.cells.has(key)) {
                            nearby.push(...this.cells.get(key));
                        }
                    }
                }
                return nearby;
            }

            clear() {
                this.cells.clear();
            }
        }

        let scene, camera, renderer, composer, clock;
        let raycaster, groundPlane, spatialGrid;
        let player, playerLight, aimIndicator;
        let gameHasStarted = false;
        let boss = null;
        let isBossWave = false;
        
        const SPEED_MULTIPLIER = 1.2; 
        const SPAWN_MULTIPLIER = 1.4; 
        
        const gameBounds = 50;
        const playerSpeed = 15;
        const FIREBALL_COOLDOWN_TIME = 0.2;
        const DASHER_DASH_COOLDOWN = 3.5;
        const BOMBER_DAMAGE = 20;
        const MISSILE_DAMAGE = 15;
        const STATIC_ORB_DAMAGE = 18;
        const BOSS_SWORD_DAMAGE = 40;
        const ENEMY_TYPES = [
            { name: 'standard', geo: new THREE.DodecahedronGeometry(2), color: 0xff4136, speed: 6, health: 1 },
            { name: 'brute', geo: new THREE.OctahedronGeometry(2.5), color: 0x008080, speed: 4, health: 3 },
            { name: 'dasher', geo: new THREE.ConeGeometry(2, 4, 8), color: 0x39FF14, speed: 5, health: 2 },
            { name: 'bomber', geo: new THREE.IcosahedronGeometry(2.2), color: 0xFF8C00, speed: 8, health: 1, explodes: true, explosionRadius: 8 },
            { name: 'shooter', geo: new THREE.TetrahedronGeometry(2.5), color: 0xDA70D6, speed: 3, health: 1, shoots: true, shootCooldown: 4.0, projectileType: 'missile' },
            { name: 'mage', geo: new THREE.CapsuleGeometry(1.5, 2.5, 4, 10), color: 0x00c1ff, speed: 3.5, health: 2, shoots: true, shootCooldown: 5.0, projectileType: 'static_orb'}
        ];

        const ENEMY_GEOMETRIES = {};
        const ENEMY_MATERIALS = {};

        let score = 0, wave = 0, enemiesToSpawn = 5;
        let playerHealth = 100, gameOver = false, isPaused = false;
        let elapsedTime = 0;
        let preparedEnemies = [];
        let uiUpdateTimer = 0;
        let isPreloading = false;
        let nextWaveReady = false;

        let activeController = null;
        let fireballCooldown = 0;
        let keysPressed = {};
        const mousePos = new THREE.Vector2();
        const aimDirection = new THREE.Vector3();
        let controllerPauseDebounce = false;

        const _v1 = new THREE.Vector3();
        const _v2 = new THREE.Vector3();
        const _intersectionPoint = new THREE.Vector3();

        const uiContainer = document.getElementById('ui-container');
        const startScreenUI = document.getElementById('start-screen');
        const startButton = document.getElementById('start-button');
        const waveInput = document.getElementById('wave-input');
        const scoreUI = document.getElementById('score');
        const waveUI = document.getElementById('wave-counter');
        const healthBarUI = document.getElementById('health-bar');
        const controllerStatusUI = document.getElementById('controller-status');
        const gameOverScreenUI = document.getElementById('game-over-screen');
        const gameOverTitleUI = document.getElementById('game-over-title');
        const finalScoreUI = document.getElementById('final-score');
        const restartButton = document.getElementById('restart-button');
        const pauseScreenUI = document.getElementById('pause-screen');
        const timerUI = document.getElementById('timer');
        const bossUI = document.getElementById('boss-ui');
        const bossNameUI = document.getElementById('boss-name');
        const bossHealthBarUI = document.getElementById('boss-health-bar');
        const loadingWaveScreenUI = document.getElementById('loading-wave-screen');

        const enemyPool = [];
        const projectilePool = [];
        const missilePool = [];
        const staticOrbPool = [];
        const particlePool = [];
        const explosionPool = [];
        const activeEnemies = [];
        const activeProjectiles = [];
        const activeMissiles = [];
        const activeStaticOrbs = [];
        const activeParticles = [];
        const activeExplosions = [];

        function initializeApp() {
            clock = new THREE.Clock();
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000104);
            scene.fog = new THREE.FogExp2(0x000104, 0.015);

            camera = new THREE.PerspectiveCamera(85, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 40, 25);
            camera.lookAt(scene.position);

            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.body.appendChild(renderer.domElement);

            const renderPass = new RenderPass(scene, camera);
            const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.6, 0.1, 0.1);
            composer = new EffectComposer(renderer);
            composer.addPass(renderPass);
            composer.addPass(bloomPass);

            const ambientLight = new THREE.AmbientLight(0x404040, 5);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 2.25);
            dirLight.position.set(25, 130, 25);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            dirLight.shadow.camera.left = -gameBounds;
            dirLight.shadow.camera.right = gameBounds;
            dirLight.shadow.camera.top = gameBounds;
            dirLight.shadow.camera.bottom = -gameBounds;
            scene.add(dirLight);

            raycaster = new THREE.Raycaster();
            groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
            
            const gridBounds = { x: -gameBounds * 1.5, z: -gameBounds * 1.5, width: gameBounds * 3, height: gameBounds * 3 };
            const gridDimensions = { width: 10, height: 10 };
            spatialGrid = new SpatialGrid(gridBounds, gridDimensions);

            preloadGeometriesAndMaterials();
            createPlayer();
            createGround();
            createObjectPools();
            setupEventListeners();
            
            composer.render();
        }

        function setupEventListeners() {
            window.addEventListener('resize', onWindowResize, false);
            restartButton.addEventListener('click', restartGame);
            
            startButton.addEventListener('click', () => {
                const startingWave = parseInt(waveInput.value, 10);
                startGame(startingWave);
            });
            
            window.addEventListener('keydown', (e) => { 
                if (!gameHasStarted) return;
                keysPressed[e.code] = true; 
                if (e.code === 'Escape') {
                    togglePause();
                }
            });
            window.addEventListener('keyup', (e) => { 
                if (!gameHasStarted) return;
                keysPressed[e.code] = false; 
            });

            window.addEventListener('mousemove', (e) => {
                if (!gameHasStarted || isPaused) return;
                mousePos.x = (e.clientX / window.innerWidth) * 2 - 1;
                mousePos.y = - (e.clientY / window.innerHeight) * 2 + 1;
            });
        }

        function startGame(startingWave = 1) {
            gameHasStarted = true;
            startScreenUI.style.display = 'none';
            uiContainer.style.display = 'flex';
            document.body.style.cursor = 'none';

            wave = (startingWave && startingWave > 0) ? startingWave - 1 : 0;
            score = 0;
            elapsedTime = 0;
            playerHealth = 100;
            gameOver = false;
            isPaused = false;
            isBossWave = false; 
            
            healthBarUI.style.width = '100%';
            player.position.set(0, 2, 0);
            
            preloadNextWave(); 
            animate();
        }

        function togglePause() {
            if (gameOver) return;

            isPaused = !isPaused;
            pauseScreenUI.style.display = isPaused ? 'flex' : 'none';
            document.body.style.cursor = isPaused ? 'default' : 'none';
            
            if (!isPaused) {
                document.body.style.cursor = 'none';
                clock.getDelta();
            }
        }
        
        function preloadGeometriesAndMaterials() {
            ENEMY_TYPES.forEach(type => {
                ENEMY_GEOMETRIES[type.name] = type.geo;
                ENEMY_MATERIALS[type.name] = new THREE.MeshStandardMaterial({
                    color: type.color,
                    metalness: 0.6,
                    roughness: 0.4,
                    emissive: type.color,
                    emissiveIntensity: 0.3
                });
            });
        }

        function createObjectPools() {
            for (let i = 0; i < 150; i++) {
                createEnemy(true);
            }
            for (let i = 0; i < 75; i++) {
                createFireball(true);
            }
            for (let i = 0; i < 50; i++) {
                createMissile(true);
                createStaticOrb(true);
            }
            for (let i = 0; i < 300; i++) {
                createParticleEmitter(true);
            }
            for (let i = 0; i < 20; i++) {
                createExplosion(true);
            }
        }
        
        function getFromPool(pool, activeList, creationFunc) {
            let obj = pool.length > 0 ? pool.pop() : creationFunc(true);
            if (activeList) {
                obj.visible = true;
                activeList.push(obj);
            }
            return obj;
        }

        function returnToPool(obj, pool, activeList) {
            obj.visible = false;
            obj.position.set(0, -100, 0); 
            if (activeList) {
                const index = activeList.indexOf(obj);
                if (index > -1) {
                    activeList.splice(index, 1);
                }
            }
            pool.push(obj);
        }

        function createPlayer() {
            const playerGroup = new THREE.Group();
            playerGroup.position.y = 2;
            const bodyGeo = new THREE.IcosahedronGeometry(2, 0);
            const bodyMat = new THREE.MeshStandardMaterial({
                color: 0x228B22, metalness: 0.7, roughness: 0.3,
                emissive: 0x006400, emissiveIntensity: 0.5
            });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.castShadow = true;
            playerGroup.add(body);
            const crystalGeo = new THREE.OctahedronGeometry(0.5, 0);
            const crystalMat = new THREE.MeshStandardMaterial({
                color: 0x00FFFF, metalness: 0.2, roughness: 0.1,
                emissive: 0x00FFFF, emissiveIntensity: 1
            });
            for (let i = 0; i < 5; i++) {
                const crystal = new THREE.Mesh(crystalGeo, crystalMat);
                const angle = (i / 5) * Math.PI * 2;
                crystal.position.set(Math.cos(angle) * 3, 0, Math.sin(angle) * 3);
                playerGroup.add(crystal);
            }
            player = playerGroup;
            scene.add(player);
            playerLight = new THREE.PointLight(0x00FFFF, 10, 40);
            playerLight.castShadow = true;
            player.add(playerLight);
            const aimGeo = new THREE.TorusGeometry(0.6, 0.1, 8, 32);
            aimGeo.rotateX(Math.PI / 2);
            const aimMat = new THREE.MeshBasicMaterial({ color: 0x00FFFF, transparent: true, opacity: 0.7 });
            aimIndicator = new THREE.Mesh(aimGeo, aimMat);
            aimIndicator.visible = false;
            scene.add(aimIndicator);
        }

        function createGround() {
            const groundGeo = new THREE.PlaneGeometry(gameBounds * 2, gameBounds * 2);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x1a2a3a, metalness: 0.2, roughness: 0.8 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);
            const grid = new THREE.GridHelper(gameBounds * 2, 50, 0x00ffff, 0x004444);
            grid.material.transparent = true;
            grid.material.opacity = 0.2;
            scene.add(grid);
        }

        function createEnemy(isPoolCreation = false) {
            const enemy = new THREE.Mesh(ENEMY_GEOMETRIES['standard'], ENEMY_MATERIALS['standard']);
            enemy.castShadow = true;
            enemy.userData = {};
            const light = new THREE.PointLight(0xffffff, 2, 15);
            enemy.add(light);
            if (isPoolCreation) {
                enemy.visible = false;
                scene.add(enemy);
                enemyPool.push(enemy);
            }
            return enemy;
        }

        function createBoss() {
            const bossGroup = new THREE.Group();
            bossGroup.position.y = 5; 

            const bodyGeo = new THREE.IcosahedronGeometry(5, 1);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.9, roughness: 0.2 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.castShadow = true;
            bossGroup.add(body);
            
            const orbColors = [0xff4136, 0x00c1ff, 0x39FF14, 0xFF8C00, 0xDA70D6];
            const orbs = new THREE.Group();
            orbColors.forEach(color => {
                const orbGeo = new THREE.SphereGeometry(1, 16, 16);
                const orbMat = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 2 });
                const orb = new THREE.Mesh(orbGeo, orbMat);
                const light = new THREE.PointLight(color, 5, 20);
                orb.add(light);
                orb.position.set((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10).normalize().multiplyScalar(6);
                orbs.add(orb);
            });
            bossGroup.add(orbs);

            const swordGeo = new THREE.BoxGeometry(0.5, 12, 1);
            const swordMat = new THREE.MeshStandardMaterial({ color: 0x00FFFF, emissive: 0x00FFFF, emissiveIntensity: 1, metalness: 0.8, roughness: 0.3});
            const sword = new THREE.Mesh(swordGeo, swordMat);
            sword.position.set(6, 0, 0);
            sword.userData = { state: 'HELD', target: new THREE.Vector3(), stuckTimer: 0, canDamage: false };
            bossGroup.add(sword);

            bossGroup.userData = {
                name: 'The FullStack Dev', health: 460, maxHealth: 460, speed: 4.6,
                orbs: orbs, sword: sword, state: 'MOVING', stateTimer: 3,
                dashCooldown: 8, shootCooldown: 6, swordCooldown: 10, summonCooldown: 7,
            };
            return bossGroup;
        }
        
        function preloadNextWave() {
            if (isPreloading) return; 
            isPreloading = true;
            nextWaveReady = false;

            const nextWaveNumber = wave + 1;

            if (nextWaveNumber === 21) {
                preparedEnemies = []; 
                nextWaveReady = true;
                isPreloading = false;
                return;
            } 
            
            enemiesToSpawn = Math.floor(5 * (1 + nextWaveNumber * 0.2) * SPAWN_MULTIPLIER);
            
            let enemiesCreated = 0;
            function preloadBatch() {
                const batchSize = 10;
                let loadedInBatch = 0;
                while (enemiesCreated < enemiesToSpawn && loadedInBatch < batchSize) {
                    const enemy = getFromPool(enemyPool, null, createEnemy);
                    configureEnemy(enemy, nextWaveNumber);
                    preparedEnemies.push(enemy);
                    enemiesCreated++;
                    loadedInBatch++;
                }

                if (enemiesCreated < enemiesToSpawn) {
                    setTimeout(preloadBatch, 16);
                } else {
                    nextWaveReady = true;
                    isPreloading = false;
                }
            }
            setTimeout(preloadBatch, 16);
        }
        
        function configureEnemy(enemy, waveNumber) {
            const availableTypes = ENEMY_TYPES.filter(type => 
                (type.name === 'standard' || type.name === 'brute') ||
                (type.name === 'dasher' && waveNumber >= 4) ||
                (type.name === 'bomber' && waveNumber >= 8) ||
                (type.name === 'shooter' && waveNumber >= 12) ||
                (type.name === 'mage' && waveNumber >= 16)
            );
            const type = availableTypes.length > 0 ? availableTypes[Math.floor(Math.random() * availableTypes.length)] : ENEMY_TYPES[0];

            enemy.geometry = ENEMY_GEOMETRIES[type.name];
            enemy.material = ENEMY_MATERIALS[type.name];
            enemy.children[0].color.set(type.color);

            enemy.userData.baseSpeed = type.speed * SPEED_MULTIPLIER;
            enemy.userData.speed = type.speed * SPEED_MULTIPLIER;
            enemy.userData.baseHealth = type.health;
            enemy.userData.health = type.health;
            enemy.userData.name = type.name;
            
            enemy.userData.isDashing = false;
            enemy.userData.explodes = type.explodes || false;
            enemy.userData.shoots = type.shoots || false;

            if (type.name === 'dasher') enemy.userData.dashTimer = DASHER_DASH_COOLDOWN;
            if (type.explodes) enemy.userData.explosionRadius = type.explosionRadius;
            if (type.shoots) {
                enemy.userData.shootCooldown = type.shootCooldown;
                enemy.userData.shootTimer = Math.random() * type.shootCooldown;
                enemy.userData.projectileType = type.projectileType;
            }
        }
        
        function createFireball(isPoolCreation = false) {
            const projGeo = new THREE.SphereGeometry(0.8, 16, 16);
            const projMat = new THREE.MeshStandardMaterial({
                color: 0xffa500, emissive: 0xffa500, emissiveIntensity: 2,
                metalness: 0, roughness: 0.5
            });
            const projectile = new THREE.Mesh(projGeo, projMat);
            projectile.userData.velocity = new THREE.Vector3();
            const light = new THREE.PointLight(0xffa500, 5, 20);
            projectile.add(light);
            if (isPoolCreation) {
                projectile.visible = false;
                scene.add(projectile);
                projectilePool.push(projectile);
            }
            return projectile;
        }

        function createMissile(isPoolCreation = false) {
            const geo = new THREE.CylinderGeometry(0.2, 0.4, 1.5, 8);
            const mat = new THREE.MeshStandardMaterial({ color: 0xDA70D6, emissive: 0xDA70D6, emissiveIntensity: 2 });
            const missile = new THREE.Mesh(geo, mat);
            missile.userData.velocity = new THREE.Vector3();
            const light = new THREE.PointLight(0xDA70D6, 3, 10);
            missile.add(light);
            if (isPoolCreation) {
                missile.visible = false;
                scene.add(missile);
                missilePool.push(missile);
            }
            return missile;
        }
        
        function createStaticOrb(isPoolCreation = false) {
            const geo = new THREE.SphereGeometry(1.2, 16, 16);
            const mat = new THREE.MeshStandardMaterial({ color: 0x008080, emissive: 0x00E0E0, emissiveIntensity: 2.5, transparent: true, opacity: 0.8 });
            const orb = new THREE.Mesh(geo, mat);
            orb.userData = {
                velocity: new THREE.Vector3(), targetPosition: new THREE.Vector3(),
                state: 'IDLE', lifeTimer: 0
            };
            const light = new THREE.PointLight(0x00E0E0, 4, 15);
            orb.add(light);
            if (isPoolCreation) {
                orb.visible = false;
                scene.add(orb);
                staticOrbPool.push(orb);
            }
            return orb;
        }

        function shootFireball() {
            if (aimDirection.lengthSq() === 0 || fireballCooldown > 0) return;
            const projectile = getFromPool(projectilePool, activeProjectiles, createFireball);
            projectile.position.copy(player.position);
            projectile.userData.velocity.copy(aimDirection).normalize().multiplyScalar(40);
            fireballCooldown = FIREBALL_COOLDOWN_TIME;
        }

        function enemyShoot(shooter) {
            const projectileType = shooter.userData.projectileType;
            _v1.subVectors(player.position, shooter.position).normalize();

            if (projectileType === 'missile') {
                const missile = getFromPool(missilePool, activeMissiles, createMissile);
                missile.position.copy(shooter.position);
                missile.quaternion.setFromUnitVectors(_v2.set(0, 1, 0), _v1);
                missile.userData.velocity.copy(_v1).multiplyScalar(25);
            } else if (projectileType === 'static_orb') {
                const orb = getFromPool(staticOrbPool, activeStaticOrbs, createStaticOrb);
                orb.position.copy(shooter.position);
                orb.userData.targetPosition.copy(player.position);
                _v2.subVectors(orb.userData.targetPosition, shooter.position).normalize();
                orb.userData.velocity.copy(_v2).multiplyScalar(30);
                orb.userData.state = 'MOVING';
            }
        }
        
        function createParticleEmitter(isPoolCreation = false) {
            const count = 20; 
            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(count * 3), 3));
            const mat = new THREE.PointsMaterial({ size: 0.5, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false });
            const emitter = new THREE.Points(geom, mat);
            emitter.userData = { velocities: Array.from({length: count}, () => new THREE.Vector3()), life: 0 };
            if (isPoolCreation) {
                emitter.visible = false;
                scene.add(emitter);
                particlePool.push(emitter);
            }
            return emitter;
        }
        
        function triggerParticleExplosion(position, color) {
            const emitter = getFromPool(particlePool, activeParticles, createParticleEmitter);
            emitter.position.copy(position);
            emitter.material.color.set(color);
            emitter.userData.life = 1.0;
            const posAttr = emitter.geometry.attributes.position;
            for (let i = 0; i < emitter.userData.velocities.length; i++) {
                emitter.userData.velocities[i].set((Math.random()-0.5)*10, (Math.random()-0.5)*10, (Math.random()-0.5)*10);
                posAttr.setXYZ(i, 0, 0, 0);
            }
            posAttr.needsUpdate = true;
        }
        
        function createExplosion(isPoolCreation = false) {
            const geometry = new THREE.SphereGeometry(1, 32, 32);
            const material = new THREE.MeshBasicMaterial({ color: 0xff8c00, transparent: true, opacity: 0.8 });
            const explosion = new THREE.Mesh(geometry, material);
            explosion.userData = { life: 0, duration: 0.4 };
            if (isPoolCreation) {
                explosion.visible = false;
                scene.add(explosion);
                explosionPool.push(explosion);
            }
            return explosion;
        }
        
        function triggerExplosionAnimation(position, color, finalSize) {
            const explosion = getFromPool(explosionPool, activeExplosions, createExplosion);
            explosion.position.copy(position);
            explosion.material.color.set(color);
            explosion.userData.life = explosion.userData.duration;
            explosion.userData.finalSize = finalSize;
            explosion.scale.set(0.1, 0.1, 0.1);
        }

        function updateParticles(deltaTime) {
            for (let i = activeParticles.length - 1; i >= 0; i--) {
                const emitter = activeParticles[i];
                emitter.userData.life -= deltaTime * 2.5; 
                if (emitter.userData.life <= 0) {
                    returnToPool(emitter, particlePool, activeParticles);
                    continue;
                }
                emitter.material.opacity = emitter.userData.life;
                const posAttr = emitter.geometry.attributes.position;
                for (let j = 0; j < emitter.userData.velocities.length; j++) {
                    const vel = emitter.userData.velocities[j];
                    _v1.copy(vel).multiplyScalar(deltaTime);
                    posAttr.setXYZ(j, posAttr.getX(j) + _v1.x, posAttr.getY(j) + _v1.y, posAttr.getZ(j) + _v1.z);
                }
                posAttr.needsUpdate = true;
            }
        }

        function updateExplosions(deltaTime) {
            for (let i = activeExplosions.length - 1; i >= 0; i--) {
                const explosion = activeExplosions[i];
                explosion.userData.life -= deltaTime;
                if (explosion.userData.life <= 0) {
                    returnToPool(explosion, explosionPool, activeExplosions);
                    continue;
                }
                const progress = 1 - (explosion.userData.life / explosion.userData.duration);
                const currentScale = explosion.userData.finalSize * progress;
                explosion.scale.set(currentScale, currentScale, currentScale);
                explosion.material.opacity = 1 - progress;
            }
        }

        function startWave() {
            if (gameOver || !nextWaveReady) return;

            wave++;
            waveUI.textContent = `Wave: ${wave}`;
            loadingWaveScreenUI.style.display = 'none';
            
            [...activeStaticOrbs].forEach(orb => returnToPool(orb, staticOrbPool, activeStaticOrbs));

            if (wave === 21) {
                isBossWave = true;
                player.position.set(0, player.position.y, 0);

                boss = createBoss();
                scene.add(boss);
                boss.position.set(0, 5, -40); 
                bossUI.style.display = 'flex';
                bossNameUI.textContent = boss.userData.name;
                bossHealthBarUI.style.width = '100%';
            } else {
                isBossWave = false;
                preparedEnemies.forEach(enemy => {
                    const angle = Math.random() * Math.PI * 2;
                    const radius = gameBounds + Math.random() * 20;
                    const yPosition = (enemy.userData.name === 'dasher' || enemy.userData.name === 'bomber' || enemy.userData.name === 'shooter' || enemy.userData.name === 'mage') ? 2 : 2.5; 
                    enemy.position.set(Math.cos(angle) * radius, yPosition, Math.sin(angle) * radius);
                    enemy.visible = true;
                    activeEnemies.push(enemy);
                });
                preparedEnemies = [];
            }
            
            nextWaveReady = false; 
        }

        function handleInput(deltaTime) {
            const gamepad = navigator.getGamepads()[0];
            if (gamepad) {
                if (!activeController) {
                    activeController = gamepad;
                    controllerStatusUI.textContent = `Controle Conectado: ${gamepad.id.substring(0, 20)}...`;
                }
                handleControllerInput(deltaTime, gamepad);
            } else {
                 if (activeController) {
                    activeController = null;
                    controllerStatusUI.textContent = "Dualsense / Keyboard (WASD + Move Mouse + ESC)";
                }
                handleKeyboardMouseInput(deltaTime);
            }
        }
        
        function handleKeyboardMouseInput(deltaTime) {
            _v1.set(0,0,0);
            if(keysPressed['KeyW'] || keysPressed['ArrowUp']) _v1.z -= 1;
            if(keysPressed['KeyS'] || keysPressed['ArrowDown']) _v1.z += 1;
            if(keysPressed['KeyA'] || keysPressed['ArrowLeft']) _v1.x -= 1;
            if(keysPressed['KeyD'] || keysPressed['ArrowRight']) _v1.x += 1;
            if (_v1.lengthSq() > 0) {
                player.position.add(_v1.normalize().multiplyScalar(playerSpeed * deltaTime));
            }
            
            raycaster.setFromCamera(mousePos, camera);
            if (raycaster.ray.intersectPlane(groundPlane, _intersectionPoint)) {
                aimDirection.subVectors(_intersectionPoint, player.position).setY(0);
                player.lookAt(_intersectionPoint.x, player.position.y, _intersectionPoint.z);
                aimIndicator.position.copy(_intersectionPoint).setY(0.1);
                aimIndicator.visible = true;
                shootFireball();
            }
            fireballCooldown -= deltaTime;
        }

        function handleControllerInput(deltaTime, gamepad) {
            const leftStick = new THREE.Vector2(gamepad.axes[0], gamepad.axes[1]); 
            const rightStick = new THREE.Vector2(gamepad.axes[2], gamepad.axes[3]);
            if (leftStick.length() < 0.1) leftStick.set(0, 0);
            if (rightStick.length() < 0.1) rightStick.set(0, 0);

            _v1.set(leftStick.x, 0, leftStick.y).multiplyScalar(playerSpeed * deltaTime);
            player.position.add(_v1);
            
            const startButton = gamepad.buttons[9];
            if (startButton && startButton.pressed && !controllerPauseDebounce) {
                togglePause();
                controllerPauseDebounce = true;
            } else if (startButton && !startButton.pressed) {
                controllerPauseDebounce = false;
            }

            fireballCooldown -= deltaTime;
            if (rightStick.length() > 0.5) {
                aimDirection.set(rightStick.x, 0, rightStick.y);
                aimIndicator.visible = true;
                _v2.copy(aimDirection).normalize().multiplyScalar(5);
                aimIndicator.position.copy(player.position).add(_v2).setY(0.1);
                player.lookAt(player.position.x + rightStick.x, player.position.y, player.position.z + rightStick.y);
                shootFireball();
            } else {
                aimIndicator.visible = false;
            }
        }

        function updateBoss(deltaTime) {
            if (!boss) return;

            const bossData = boss.userData;
            bossData.stateTimer -= deltaTime;
            bossData.dashCooldown -= deltaTime;
            bossData.shootCooldown -= deltaTime;
            bossData.swordCooldown -= deltaTime;
            bossData.summonCooldown -= deltaTime;

            bossData.orbs.rotation.y += deltaTime * 2;
            bossData.orbs.rotation.x -= deltaTime * 1;
            
            _v1.subVectors(player.position, boss.position).normalize();
            _v2.copy(_v1).setY(0);

            if (bossData.state !== 'SWORD_ATTACK') {
                 boss.quaternion.slerp(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,0,1), _v2), 0.1);
            }
            
            if (bossData.summonCooldown <= 0) {
                for (let i = 0; i < 6; i++) {
                    const enemy = getFromPool(enemyPool, activeEnemies, createEnemy);
                    configureEnemy(enemy, wave);
                    
                    const angle = Math.random() * Math.PI * 2;
                    const radius = gameBounds + Math.random() * 20;
                    const yPosition = (enemy.userData.name === 'dasher' || enemy.userData.name === 'bomber' || enemy.userData.name === 'shooter' || enemy.userData.name === 'mage') ? 2 : 2.5; 
                    enemy.position.set(Math.cos(angle) * radius, yPosition, Math.sin(angle) * radius);
                    
                    enemy.visible = true;
                }
                bossData.summonCooldown = 7; 
            }

            switch(bossData.state) {
                case 'MOVING':
                    boss.position.add(_v1.multiplyScalar(bossData.speed * deltaTime));
                    if (bossData.dashCooldown <= 0) {
                        bossData.state = 'DASHING'; bossData.dashTimer = 0.5; bossData.dashCooldown = 10;
                    } else if (bossData.swordCooldown <= 0) {
                        bossData.state = 'SWORD_ATTACK'; bossData.swordCooldown = 10;
                    } else if (bossData.shootCooldown <= 0) {
                        bossData.state = 'SHOOTING'; bossData.stateTimer = 2; bossData.shootCooldown = 7;
                    }
                    break;
                case 'DASHING':
                    boss.position.add(_v1.multiplyScalar(bossData.speed * 5 * deltaTime));
                    bossData.dashTimer -= deltaTime;
                    if(bossData.dashTimer <= 0) bossData.state = 'MOVING';
                    break;
                case 'SWORD_ATTACK':
                    const sword = bossData.sword;
                    const swordData = sword.userData;

                    switch(swordData.state) {
                        case 'HELD':
                            swordData.state = 'THROWING';
                            swordData.canDamage = true;
                            swordData.target.copy(player.position).setY(0.1);
                            scene.attach(sword);
                            break;
                        case 'THROWING':
                            sword.lookAt(player.position);
                            _v2.subVectors(swordData.target, sword.position).normalize();
                            sword.position.add(_v2.multiplyScalar(80 * deltaTime));
                            if (swordData.canDamage && player.position.distanceToSquared(sword.position) < 3**2) {
                                takeDamage(BOSS_SWORD_DAMAGE);
                                swordData.canDamage = false;
                            }
                            if (sword.position.distanceTo(swordData.target) < 1.0) {
                                swordData.state = 'STUCK';
                                swordData.stuckTimer = 3.0;
                            }
                            break;
                        case 'STUCK':
                            sword.lookAt(player.position);
                            swordData.stuckTimer -= deltaTime;
                            if (swordData.stuckTimer <= 0) {
                                swordData.state = 'RETURNING';
                                swordData.canDamage = true;
                            }
                            break;
                        case 'RETURNING':
                            const returnPos = boss.localToWorld(_v2.set(6, 0, 0));
                            sword.lookAt(player.position);
                            const returnDir = _v1.subVectors(returnPos, sword.position).normalize();
                            sword.position.add(returnDir.multiplyScalar(60 * deltaTime));
                            if (swordData.canDamage && player.position.distanceToSquared(sword.position) < 3**2) {
                                takeDamage(BOSS_SWORD_DAMAGE);
                                swordData.canDamage = false;
                            }
                            if (sword.position.distanceTo(returnPos) < 1.5) {
                                swordData.state = 'HELD';
                                boss.attach(sword);
                                sword.position.set(6, 0, 0);
                                sword.rotation.set(0, 0, 0);
                                bossData.state = 'MOVING';
                            }
                            break;
                    }
                    break;
                case 'SHOOTING':
                     if (bossData.stateTimer < 1.8 && bossData.stateTimer > 0.5 && Math.random() > 0.95) enemyShoot(boss);
                    if (bossData.stateTimer <= 0) bossData.state = 'MOVING';
                    break;
            }
        }
        
        function handleCollisions() {
            for (let i = activeProjectiles.length - 1; i >= 0; i--) {
                const p = activeProjectiles[i];
                if (!p.visible) continue;

                if (isBossWave && boss && boss.visible) {
                    if (boss.position.distanceToSquared(p.position) < 6**2) {
                        boss.userData.health--;
                        bossHealthBarUI.style.width = (boss.userData.health / boss.userData.maxHealth) * 100 + '%';
                        triggerParticleExplosion(p.position, new THREE.Color(0xffffff));
                        returnToPool(p, projectilePool, activeProjectiles);

                        if (boss.userData.health <= 0) {
                            score += 1000;
                            triggerExplosionAnimation(boss.position, new THREE.Color(0xffffff), 30);
                            if(boss.userData.sword.parent !== boss) {
                                scene.remove(boss.userData.sword);
                            }
                            scene.remove(boss); 
                            boss = null; 
                            isBossWave = false;
                            bossUI.style.display = 'none';
                            winGame();
                        }
                        continue;
                    }
                }

                const nearbyEnemies = spatialGrid.getNearby(p);
                for (const enemy of nearbyEnemies) {
                    if (!enemy.visible || enemy.userData.health <= 0) continue;

                    if (enemy.position.distanceToSquared(p.position) < 2.5**2) {
                        enemy.userData.health--;
                        triggerParticleExplosion(p.position, new THREE.Color(0xffffff));
                        returnToPool(p, projectilePool, activeProjectiles);

                        if (enemy.userData.health <= 0) {
                            score += 10;
                            scoreUI.textContent = `Score: ${score}`;
                            triggerParticleExplosion(enemy.position, enemy.material.color);
                            returnToPool(enemy, enemyPool, activeEnemies);
                        }
                        break; 
                    }
                }
            }
        }
        
        function update(deltaTime) {
            if (gameOver || !gameHasStarted || isPaused) return;
            
            if (activeEnemies.length === 0 && !isBossWave && !gameOver) {
                if (!isPreloading && !nextWaveReady) {
                    preloadNextWave();
                }
                if (isPreloading && !nextWaveReady) {
                    loadingWaveScreenUI.style.display = 'flex';
                    return;
                }
                if (nextWaveReady) {
                    startWave();
                }
            }

            elapsedTime += deltaTime;
            uiUpdateTimer += deltaTime;
            if (uiUpdateTimer > 0.25) {
                const minutes = Math.floor(elapsedTime / 60).toString().padStart(2, '0');
                const seconds = Math.floor(elapsedTime % 60).toString().padStart(2, '0');
                timerUI.textContent = `Tempo: ${minutes}:${seconds}`;
                uiUpdateTimer = 0;
            }
        
            handleInput(deltaTime);
            
            player.position.x = THREE.MathUtils.clamp(player.position.x, -gameBounds, gameBounds);
            player.position.z = THREE.MathUtils.clamp(player.position.z, -gameBounds, gameBounds);
            
            activeProjectiles.forEach(p => p.position.add(_v1.copy(p.userData.velocity).multiplyScalar(deltaTime)));
            activeMissiles.forEach(m => m.position.add(_v1.copy(m.userData.velocity).multiplyScalar(deltaTime)));
            activeStaticOrbs.forEach(orb => {
                if (orb.userData.state === 'MOVING') {
                    orb.position.add(_v1.copy(orb.userData.velocity).multiplyScalar(deltaTime));
                }
            });
            activeEnemies.forEach(e => e.position.add(_v1.subVectors(player.position, e.position).normalize().multiplyScalar(e.userData.speed * deltaTime)));

            activeProjectiles.forEach(p => { if (p.position.lengthSq() > (gameBounds * 2)**2) returnToPool(p, projectilePool, activeProjectiles); });
            activeMissiles.forEach((m) => { if (m.position.lengthSq() > (gameBounds * 2)**2) returnToPool(m, missilePool, activeMissiles); });
            activeStaticOrbs.forEach((orb) => {
                if (orb.userData.state === 'MOVING' && orb.position.distanceToSquared(orb.userData.targetPosition) < 2**2) {
                    orb.userData.state = 'STATIC'; orb.userData.lifeTimer = 10;
                } else if (orb.userData.state === 'STATIC') {
                    orb.userData.lifeTimer -= deltaTime;
                    orb.material.emissiveIntensity = 2.5 + Math.sin(clock.elapsedTime * 20) * 1.5;
                    if (orb.userData.lifeTimer <= 0) returnToPool(orb, staticOrbPool, activeStaticOrbs);
                }
            });
            activeEnemies.forEach(enemy => {
                if (enemy.userData.name === 'dasher') {
                    enemy.userData.dashTimer -= deltaTime;
                    if (!enemy.userData.isDashing && enemy.userData.dashTimer <= 0) {
                        enemy.userData.isDashing = true; enemy.userData.dashDuration = 0.25; 
                        enemy.userData.speed *= 6; enemy.children[0].intensity = 15;
                    }
                     if (enemy.userData.isDashing) {
                        enemy.userData.dashDuration -= deltaTime;
                        if (enemy.userData.dashDuration <= 0) {
                            enemy.userData.isDashing = false; enemy.userData.speed = enemy.userData.baseSpeed;
                            enemy.children[0].intensity = 2; enemy.userData.dashTimer = DASHER_DASH_COOLDOWN;
                        }
                    }
                }
                if (enemy.userData.shoots) {
                    enemy.userData.shootTimer -= deltaTime;
                    if(enemy.userData.shootTimer <= 0) {
                        enemyShoot(enemy);
                        enemy.userData.shootTimer = enemy.userData.shootCooldown;
                    }
                }
            });
            if (isBossWave) updateBoss(deltaTime);

            spatialGrid.clear();
            activeEnemies.forEach(e => { if (e.visible) spatialGrid.insert(e); });
            handleCollisions();

            for (let i = activeMissiles.length - 1; i >= 0; i--) {
                const m = activeMissiles[i];
                if (m.position.distanceToSquared(player.position) < 2**2) {
                    takeDamage(MISSILE_DAMAGE);
                    triggerParticleExplosion(m.position, new THREE.Color(0xDA70D6));
                    returnToPool(m, missilePool, activeMissiles);
                }
            }
             for (let i = activeStaticOrbs.length - 1; i >= 0; i--) {
                const orb = activeStaticOrbs[i];
                if (orb.position.distanceToSquared(player.position) < 2.5**2) {
                    takeDamage(STATIC_ORB_DAMAGE);
                    triggerParticleExplosion(orb.position, new THREE.Color(0x008080));
                    returnToPool(orb, staticOrbPool, activeStaticOrbs);
                }
            }
             for (let i = activeEnemies.length - 1; i >= 0; i--) {
                const enemy = activeEnemies[i];
                if (enemy.position.distanceToSquared(player.position) < 3**2) {
                    takeDamage(10);
                    triggerParticleExplosion(enemy.position, new THREE.Color(0xff0000));
                    returnToPool(enemy, enemyPool, activeEnemies);
                } else if (enemy.userData.explodes && enemy.position.distanceToSquared(player.position) < enemy.userData.explosionRadius**2) {
                    takeDamage(BOMBER_DAMAGE);
                    triggerParticleExplosion(enemy.position, enemy.material.color);
                    triggerExplosionAnimation(enemy.position, enemy.material.color, enemy.userData.explosionRadius);
                    returnToPool(enemy, enemyPool, activeEnemies);
                }
            }

            updateParticles(deltaTime);
            updateExplosions(deltaTime);
        }
        
        function takeDamage(amount) {
            if (gameOver) return;
            playerHealth = Math.max(0, playerHealth - amount);
            healthBarUI.style.width = playerHealth + '%';
            scene.background.set(0xff0000);
            setTimeout(() => { if (!gameOver) scene.background.set(0x000104); }, 100);
            if (playerHealth <= 0) endGame();
        }

        function endGame() {
            gameOver = true;
            isPaused = false;
            pauseScreenUI.style.display = 'none';
            aimIndicator.visible = false;
            gameOverScreenUI.style.display = 'flex';
            gameOverTitleUI.textContent = "Game Over";
            finalScoreUI.textContent = `Score Final: ${score}`;
            document.body.style.cursor = 'default';
        }

        function winGame() {
            gameOver = true;
            isPaused = false;
            pauseScreenUI.style.display = 'none';
            aimIndicator.visible = false;
            gameOverScreenUI.style.display = 'flex';
            
            const minutes = Math.floor(elapsedTime / 60).toString().padStart(2, '0');
            const seconds = Math.floor(elapsedTime % 60).toString().padStart(2, '0');
            
            gameOverTitleUI.textContent = "Jogo Concluído!";
            gameOverTitleUI.style.color = "#00FFFF";
            gameOverTitleUI.style.textShadow = "0 0 20px #00FFFF";
            finalScoreUI.textContent = `Tempo Final: ${minutes}:${seconds}`;
            document.body.style.cursor = 'default';
        }
        
        function restartGame() {
            gameOverScreenUI.style.display = 'none';
            startScreenUI.style.display = 'flex';
            uiContainer.style.display = 'none';
            bossUI.style.display = 'none';
            gameHasStarted = false;
            
            gameOverTitleUI.textContent = "Game Over";
            gameOverTitleUI.style.color = "#ff4444";
            gameOverTitleUI.style.textShadow = "0 0 20px red";

            if(boss) {
                if(boss.userData.sword.parent !== boss) {
                    scene.remove(boss.userData.sword);
                }
                scene.remove(boss);
            }
            boss = null;
            isBossWave = false;
            
            [...activeProjectiles].forEach(p => returnToPool(p, projectilePool, activeProjectiles));
            [...activeMissiles].forEach(m => returnToPool(m, missilePool, activeMissiles));
            [...activeStaticOrbs].forEach(o => returnToPool(o, staticOrbPool, activeStaticOrbs));
            [...activeParticles].forEach(p => returnToPool(p, particlePool, activeParticles));
            [...activeExplosions].forEach(e => returnToPool(e, explosionPool, activeExplosions));
            [...activeEnemies].forEach(e => returnToPool(e, enemyPool, activeEnemies));
            [...preparedEnemies].forEach(e => returnToPool(e, enemyPool, null));
            preparedEnemies = [];
            
            isPreloading = false;
            nextWaveReady = false;

            scene.background.set(0x000104);
        }

        function animate() {
            if (!gameHasStarted) return;
            requestAnimationFrame(animate);
            
            const deltaTime = Math.min(clock.getDelta(), 0.05);
            update(deltaTime);
            composer.render(deltaTime);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        initializeApp();
    </script>
</body>
</html>
